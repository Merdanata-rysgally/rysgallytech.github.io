<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Wheat stalk -->
  <line x1="35" y1="105" x2="35" y2="35" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Wheat grains (left side) -->
  <ellipse cx="30" cy="45" rx="5" ry="8" fill="white"/>
  <ellipse cx="29" cy="55" rx="5" ry="8" fill="white"/>
  <ellipse cx="30" cy="65" rx="5" ry="8" fill="white"/>
  <ellipse cx="29" cy="75" rx="5" ry="8" fill="white"/>
  <ellipse cx="30" cy="85" rx="5" ry="8" fill="white"/>
  
  <!-- Wheat grains (right side) -->
  <ellipse cx="40" cy="45" rx="5" ry="8" fill="white"/>
  <ellipse cx="41" cy="55" rx="5" ry="8" fill="white"/>
  <ellipse cx="40" cy="65" rx="5" ry="8" fill="white"/>
  <ellipse cx="41" cy="75" rx="5" ry="8" fill="white"/>
  <ellipse cx="40" cy="85" rx="5" ry="8" fill="white"/>
  
  <!-- Cow head -->
  <ellipse cx="80" cy="60" rx="22" ry="20" fill="none" stroke="white" stroke-width="2.5"/>
  
  <!-- Cow ears -->
  <ellipse cx="65" cy="48" rx="6" ry="10" fill="white"/>
  <ellipse cx="95" cy="48" rx="6" ry="10" fill="white"/>
  
  <!-- Cow eyes -->
  <circle cx="72" cy="58" r="2.5" fill="white"/>
  <circle cx="88" cy="58" r="2.5" fill="white"/>
  
  <!-- Cow snout -->
  <ellipse cx="80" cy="68" rx="10" ry="7" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="77" cy="67" r="1.5" fill="white"/>
  <circle cx="83" cy="67" r="1.5" fill="white"/>
  
  <!-- Cow horns -->
  <path d="M 63 45 Q 60 38 58 35" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 97 45 Q 100 38 102 35" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Feed bowl -->
  <path d="M 65 90 L 60 105 L 100 105 L 95 90 Z" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="80" cy="90" rx="15" ry="4" fill="white" opacity="0.5"/>
