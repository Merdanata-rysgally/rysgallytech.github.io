<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shopping cart body -->
  <path d="M 30 85 L 35 60 L 75 60 L 70 85 Z" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Cart grid pattern -->
  <line x1="42" y1="60" x2="38" y2="85" stroke="white" stroke-width="1.5"/>
  <line x1="52" y1="60" x2="48" y2="85" stroke="white" stroke-width="1.5"/>
  <line x1="62" y1="60" x2="58" y2="85" stroke="white" stroke-width="1.5"/>
  <line x1="35" y1="70" x2="70" y2="70" stroke="white" stroke-width="1.5"/>
  
  <!-- Cart handle -->
  <path d="M 75 60 L 80 45 L 85 45" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Cart wheels -->
  <circle cx="38" cy="88" r="4" fill="white"/>
  <circle cx="62" cy="88" r="4" fill="white"/>
  
  <!-- Store building -->
  <rect x="25" y="20" width="50" height="35" fill="none" stroke="white" stroke-width="2.5"/>
  
  <!-- Store roof/awning -->
  <path d="M 20 20 L 25 15 L 75 15 L 80 20" fill="white"/>
  
  <!-- Store windows -->
  <rect x="32" y="27" width="12" height="12" fill="none" stroke="white" stroke-width="2"/>
  <rect x="54" y="27" width="12" height="12" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Store door -->
  <rect x="42" y="42" width="10" height="13" fill="white"/>
  <circle cx="50" cy="48" r="1" fill="black"/>
  
  <!-- Price tag icon -->
  <path d="M 85 70 L 95 60 L 105 70 L 95 80 Z" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="95" cy="65" r="2" fill="white"/>
  <line x1="100" y1="75" x2="105" y2="80" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>