<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree trunk -->
  <rect x="43" y="60" width="10" height="45" rx="2" fill="white"/>
  
  <!-- Tree foliage (layered circles) -->
  <circle cx="48" cy="45" r="18" fill="white" opacity="0.8"/>
  <circle cx="35" cy="52" r="14" fill="white" opacity="0.9"/>
  <circle cx="61" cy="52" r="14" fill="white" opacity="0.9"/>
  <circle cx="48" cy="58" r="15" fill="white"/>
  
  <!-- Leaves detail -->
  <ellipse cx="42" cy="40" rx="6" ry="8" fill="white"/>
  <ellipse cx="54" cy="40" rx="6" ry="8" fill="white"/>
  
  <!-- Gear (landscaping machinery) -->
  <circle cx="85" cy="45" r="16" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="85" cy="45" r="7" fill="white"/>
  
  <!-- Gear teeth -->
  <rect x="83" y="27" width="4" height="6" fill="white"/>
  <rect x="83" y="57" width="4" height="6" fill="white"/>
  <rect x="99" y="43" width="6" height="4" fill="white"/>
  <rect x="71" y="43" width="6" height="4" fill="white"/>
  <rect x="95" y="33" width="5" height="5" transform="rotate(45 97.5 35.5)" fill="white"/>
  <rect x="73" y="55" width="5" height="5" transform="rotate(45 75.5 57.5)" fill="white"/>
  
  <!-- Shovel -->
  <line x1="25" y1="105" x2="25" y2="75" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 20 105 L 25 110 L 30 105 L 25 100 Z" fill="white"/>
  <rect x="23" y="72" width="4" height="8" fill="white"/>
  
  <!-- Plant sprout -->
  <path d="M 105 85 Q 105 80 102 75 Q 100 80 100 85" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 105 85 Q 105 80 108 75 Q 110 80 110 85" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <line x1="105" y1="85" x2="105" y2="95" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Ground line -->
  <line x1="15" y1="105" x2="115" y2="105" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>